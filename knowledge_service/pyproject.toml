[project]
name = "derma-knowledge"
version = "0.1.0"
description = "Service knowledge: tài liệu giáo trình (pipeline số hoá), đồ thị tri thức, retrieval (Qdrant/Neo4j)"
requires-python = ">=3.12"
dependencies = [
    "derma-shared",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "docling>=2.130.0",
    "fastapi[standard]>=0.141.1",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.6.2",
    "langchain-openrouter>=0.2.9",
    "langchain>=0.3",
    "neo4j>=5.0",
    "nltk>=3.10.3",
    "psycopg[binary]>=3.2",
    "pypdf>=5.0",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.52",
    "trafilatura>=2.2.0",
    "underthesea>=9.5.0",
    "greenlet>=3.5.6",
]

[tool.uv.sources]
derma-shared = { path = "../shared", editable = true }

[tool.pyright]
include = ["app"]
