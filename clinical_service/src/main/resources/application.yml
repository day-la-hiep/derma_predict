spring:
  application:
    name: clinical
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/clinical}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # `common` chạy trên mọi DB; `{vendor}` là phần chỉ Postgres (chỉ mục unique có điều kiện) mà H2 của test không có
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 10MB

server:
  port: 3053

derma:
  jwt:
    secret: ${JWT_SECRET_KEY:derma-secret-key-change-in-production-datn-2026}
  internal-api-key: ${INTERNAL_API_KEY:derma-internal-key-change-in-production}
  consultation-url: ${CONSULTATION_URL:http://localhost:3052}
  knowledge-url: ${KNOWLEDGE_URL:http://localhost:3054}
  identity-url: ${IDENTITY_URL:http://localhost:3051}
  # đợt bệnh `open` quá hạn không cập nhật thì chuyển `expired` (trừ đợt có lịch hẹn còn hiệu lực)
  episode-expire-days: 30
  # kênh chat theo dõi sau khám mở thêm bao nhiêu ngày kể từ lúc chốt kết luận (hết hạn thì chỉ đọc)
  followup-days: 30
  # chỉ đọc bucket ảnh đính kèm để tạo link tạm cho ảnh trong báo cáo; không tự tạo bucket
  minio:
    endpoint: ${MINIO_ENDPOINT:localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minio}
    secret-key: ${MINIO_SECRET_KEY:minio123}
    secure: ${MINIO_SECURE:false}
    bucket: ${MINIO_BUCKET:derma-attachments}
