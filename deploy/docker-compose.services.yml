name: derma-hospital

# 6 service của kiến trúc microservice (các thư mục `<tên>_service/`), chạy cạnh hạ tầng của deploy/docker-compose.yml:
#   make infra                                # hạ tầng (Postgres, Redis, RabbitMQ, Qdrant, Neo4j, MinIO)
#   make services-db                          # tạo 5 database identity/consultation/clinical/knowledge/ai (chạy lại không sao)
#   docker compose -f deploy/docker-compose.services.yml --env-file .env up -d --build
# Gateway nghe cổng 3040; core cũ vẫn giữ 3050 tới khi nghiệm thu xong. Giá trị bí mật ghi như deploy/docker-compose.yml (chỉ dùng dev).

x-java-env: &java-env
  DATABASE_USER: postgres
  DATABASE_PASSWORD: postgres
  REDIS_HOST: redis
  JWT_SECRET_KEY: derma-secret-key-change-in-production-datn-2026
  INTERNAL_API_KEY: derma-internal-key-change-in-production
  MINIO_ENDPOINT: minio:9000
  IDENTITY_URL: http://identity:3051
  CONSULTATION_URL: http://consultation:3052
  CLINICAL_URL: http://clinical:3053
  KNOWLEDGE_URL: http://knowledge:3054

x-python-env: &python-env
  INTERNAL_API_KEY: derma-internal-key-change-in-production
  JWT_SECRET_KEY: derma-secret-key-change-in-production-datn-2026
  REDIS_HOST: redis
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  MINIO_ENDPOINT: minio:9000
  CONSULTATION_URL: http://consultation:3052
  CLINICAL_URL: http://clinical:3053
  KNOWLEDGE_URL: http://knowledge:3054
  QDRANT_URL: http://qdrant:6333
  NEO4J_URL: bolt://neo4j:7687
  # OPENROUTER_API_KEY lấy từ shell/.env của người chạy, không ghi vào file
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}

services:
  identity:
    build: { context: ../identity_service, dockerfile: Dockerfile }
    image: derma-identity
    environment:
      <<: *java-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/identity
    ports: ["3051:3051"]
    networks: [derma-net]

  consultation:
    build: { context: ../consultation_service, dockerfile: Dockerfile }
    image: derma-consultation
    environment:
      <<: *java-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/consultation
      AI_URL: http://ai:3055
    ports: ["3052:3052"]
    networks: [derma-net]

  clinical:
    build: { context: ../clinical_service, dockerfile: Dockerfile }
    image: derma-clinical
    environment:
      <<: *java-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/clinical
    ports: ["3053:3053"]
    networks: [derma-net]

  knowledge:
    build: { context: .., dockerfile: knowledge_service/Dockerfile }
    image: derma-knowledge
    environment:
      <<: *python-env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/knowledge
    ports: ["3054:3054"]
    networks: [derma-net]

  knowledge-worker:
    image: derma-knowledge
    command: ["python", "-u", "-m", "app.workers.document_ingest_worker"]
    environment:
      <<: *python-env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/knowledge
    depends_on: [knowledge]
    networks: [derma-net]

  ai:
    build: { context: .., dockerfile: ai_service/Dockerfile }
    image: derma-ai
    environment:
      <<: *python-env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai
    ports: ["3055:3055"]
    networks: [derma-net]

  gateway:
    build: { context: ../gateway_service, dockerfile: Dockerfile }
    image: derma-gateway
    environment:
      IDENTITY_URL: http://identity:3051
      CONSULTATION_URL: http://consultation:3052
      CLINICAL_URL: http://clinical:3053
      KNOWLEDGE_URL: http://knowledge:3054
    ports: ["3040:3040"]
    depends_on: [identity, consultation, clinical, knowledge]
    networks: [derma-net]

networks:
  derma-net:
    external: true
    name: derma-hospital_derma-net
