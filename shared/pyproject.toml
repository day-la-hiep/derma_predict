[project]
name = "derma-shared"
version = "0.1.0"
description = "Thư viện dùng chung của các service Python (knowledge, agent): settings, log, JWT verify, client Redis/RabbitMQ/MinIO, lỗi chuẩn"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4",
    "minio>=7.2.20",
    "pydantic-settings>=2.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.0",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["derma_shared"]
